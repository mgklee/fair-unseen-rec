[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fair-unseen-rec"
version = "0.1.0"
description = "Gender-audited inductive MultVAE recommendation for unseen MovieLens users"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "torch>=2.1",
  "streamlit>=1.40",
]

[project.optional-dependencies]
test = ["pytest>=8"]
config = ["PyYAML>=6"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]

